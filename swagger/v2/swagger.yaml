  "/reports/tag_rate":
    post:
      summary: Gets tag rate report per site and time bucket
      tags:
      - reports
      description: |
        Returns tag detection counts per site and time bucket. Each group
        includes the total count of recorded and analysed audio minutes,
        analysis job IDs that contributed to the analysed audio, total manual
        minutes (minutes with a manually annotated or manually imported tag),
        and per-tag detected minute counts split by manual and analysis tagging
        sources. The `options` parameter specifies the bucket size (day, week,
        month, or year). The optional `filter` parameter is applied to audio
        recordings. Results only include audio recordings the user has reader
        access to.
      parameters: []
      security:
      - auth_token_header: []
      responses:
        '422':
          description: rejects paging parameters
          content:
            application/json:
              example:
                meta:
                  status: 422
                  message: Unprocessable Content
                  error:
                    details: 'The request could not be understood: Paging, sorting,
                      and projection parameters are not allowed in group by or reporting
                      requests.'
                data:
        '200':
          description: tag rate report retrieved
          content:
            application/json:
              example:
                meta:
                  status: 200
                  message: OK
                  filter:
                    tags.id:
                      eq: 27
                data:
                - site_id: 40
                  range:
                  - '2000-05-05T00:00:00.000Z'
                  - '2000-05-06T00:00:00.000Z'
                  tags: []
                  total_minutes: 1000.0
                  total_analysed_minutes: 0.0
                  manual_events_minutes: 0
                  analysis_ids: []
              schema:
                allOf:
                - "$ref": "#/components/schemas/standard_response"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          range:
                            type: array
                            items:
                              type: string
                              format: date-time
                            minItems: 2
                            maxItems: 2
                            additionalItems: false
                            description: The start and end of the time range as an
                              ISO8601 interval string
                          tags:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                tag_id:
                                  type:
                                    "$ref": "#/components/schemas/id"
                                    readOnly: true
                                detected_manual_minutes:
                                  type: integer
                                  description: "The number of minutes containing at
                                    least one annotation with this tag that was manually
                                    annotated or manually\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t
                                    imported. Here, \"manual\" describes how the annotation
                                    entered the system, not how the detection was
                                    produced; imported annotations\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t
                                    may contain detections generated by offline analyses."
                                detected_analysis_minutes:
                                  type: integer
                                  description: The number of minutes where the tag
                                    was detected from an analysis source
                                detected_combined_minutes:
                                  type: integer
                                  description: The number of distinct minutes with
                                    a tag detection from any source
                          site_id:
                            type:
                              "$ref": "#/components/schemas/id"
                              readOnly: true
                          analysis_ids:
                            type: array
                            items:
                              type:
                                "$ref": "#/components/schemas/id"
                                readOnly: true
                              description: The analysis job IDs of any analysed audio
                                recordings for the current site and range
                          total_minutes:
                            type: number
                            description: The total number of minutes in the bucket
                              for the site
                          manual_events_minutes:
                            type: number
                            description: The number of minutes in the range for the
                              site that have at least one manual tag detection
                          total_analysed_minutes:
                            type: number
                            description: The number of minutes in the range for the
                              site that have at least one successful analysis
                        required:
                        - range
                        - tags
                        - site_id
                        - analysis_ids
                        - total_minutes
                        - manual_events_minutes
                        - total_analysed_minutes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  "$ref": "#/components/schemas/filter_payload_filter"
                sort:
                page:
                projection:
                options:
                  allOf:
                  - "$ref": "#/components/schemas/filter_payload_options"
                  - type: object
                    properties:
                      bucket_size:
                        type: string
                        enum:
                        - day
                        - week
                        - month
                        - year
                    required:
                    - bucket_size
              required:
              - options
        required: true
  "/audio_recordings/downloader":
    post:
      summary: Gets a templated script which can download original audio files. Accepts
        an audio recordings filter object
      tags:
      - downloader
      - audio_recordings
      consumes:
      security:
      - auth_token_header: []
      parameters: []
      description: |2

        Users that can invoke this route: `Admin`, `owner user`, `writer`, `reader`, `no_access`, `anyone`.<br />
        Users that can't: `Harvester`.

        Note: accessing a list/index/filter endpoint may return no results due to project permissions
      responses:
        '200':
          description: templated script
          content:
            text/plain:
              example: |
                #!/usr/bin/env pwsh

                # Requires -Version 7
                <#

                .DESCRIPTION

                  Downloads a set of recordings from an acoustic workbench.
                  Will work on Windows, Linux, or MacOSX with PowerShell Core.
                  See https://docs.microsoft.com/en-us/powershell/scripting/install/installing-powershell?view=powershell-7.1
                  for installation instructions.

                  Version 15.3.7 from http://web:3000.

                .EXAMPLE

                On Windows:

                PS> ./download_audio_files.ps1

                .EXAMPLE

                On Linux/MacOSX:

                $ chmod +x download_audio_files.ps1
                $ ./download_audio_files.ps1

                #>

                param(
                  # Where to download the recordings. Defaults to the present working directory if not specified.
                  $target = $null,
                  # Overwrite existing files without checking their size first.
                  [switch]$clobber,
                    # The auth token to use to login to the workbench. You only need to supply an auth token if you want to log in without a password.
                  $auth_token = $null,
                  # The username to use to login to the workbench. This value's default value is templated when the script is generated. This is not needed if you use an auth_token.
                  $user_name = $null,
                  # The poassword to use to login to the workbench. This is not needed if you use an auth_token.
                  $password = $null,

                  # The filter to use to select audio recordings to download. This value's default value is templated when the script is generated.
                  # See https://github.com/QutEcoacoustics/baw-server/wiki/API:-Filtering for details on valid filters. This argument
                  # should be a valid JSON encoded string.
                  $filter = $null,
                  # The acoustic workbench instance to use. This value's default value is templated when the script is generated.
                  $workbench_url = $null
                )

                $InformationPreference = 'Continue'
                $ErrorActionPreference = 'Stop'
                # https://github.com/PowerShell/PowerShell/issues/14348
                $ProgressPreference = 'SilentlyContinue'

                Write-Information "Acoustic Workbench downloader script version 15.3.7"

                if ($null -eq $target) {
                  $target = $pwd
                }

                # templated values from script generation
                if ($null -eq $auth_token) {
                  if ($null -eq $user_name) {
                    $user_name = "Admin"
                    if (-not $user_name) {
                      Write-Error "user_name is required"
                      exit 1
                    }
                  }
                  Write-Information "User name: $user_name"
                }
                else {
                  Write-Information "Using supplied auth token $auth_token"
                }

                if ($null -eq $filter) {
                  $filter = @'
                {"projection":{"only":["id","recorded_date","sites.name","site_id","canonical_file_name"]},"sorting":{"order_by":"recorded_date","direction":"desc"},"paging":{"items":25}}
                '@
                }
                Write-Information "Filter: $filter"

                if ($null -eq $workbench_url) {
                  $workbench_url = "http://web:3000"
                }
                Write-Information "Workbench URL: $workbench_url"

                # end templated values


                # log in
                $headers = @{}

                if ($null -eq $auth_token) {
                  if ($user_name -and $password) {
                    $User = $user_name
                    $PWord = ConvertTo-SecureString -String $password -AsPlainText -Force
                    $credentials = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList $User, $PWord
                  }
                  else {
                    $credentials = Get-Credential -Message "Provide credentials for logging into $workbench_url" -UserName $user_name
                  }


                  $json_credentials = $credentials.GetNetworkCredential() | ForEach-Object{
                      if ($_.UserName -like '*@*') {
                        @{"email"=$_.UserName;"password"=$_.Password}
                      }
                      else {
                        @{"login"=$_.UserName;"password"=$_.Password}
                      }
                  }

                  Write-Information "Logging in to workbench $workbench"


                    $auth_reponse = Invoke-WebRequest -Uri "$workbench_url/security" -Method POST -Body $json_credentials -Headers $headers -SkipHttpErrorCheck
                    if ($auth_reponse.BaseResponse.IsSuccessStatusCode) {
                      $auth_token = ($auth_reponse.Content | ConvertFrom-Json).data.auth_token
                    }
                    else {
                      Write-Error ("Login attempt failed ($($auth_reponse.StatusCode)) " + $auth_reponse.Content)
                      exit 1
                    }

                }
                else {
                  # we have auth token, nothing else to do?
                }
                $headers["Authorization"] = "Token token=`"$auth_token`""

                $json_headers = $headers.Clone()
                $json_headers["Content-Type"] = "application/json"
                $json_headers["Accept"] = "application/json"

                Write-Information "Downloading recordings"

                # start paging through results!
                $script:current_page = 0
                $script:max_page = $null
                function Get-NextPage() {
                  $script:current_page += 1
                  if (($null -ne $script:max_page) -and ($script:current_page -gt $script:max_page)) {
                    Write-Information "Reached end of pages"
                    return $null
                  }

                  Write-Information "Getting page $script:current_page"

                  $response = Invoke-RestMethod -Uri "$workbench_url/audio_recordings/filter?page=$script:current_page" `
                    -Method POST -Body $filter -Headers $json_headers -SkipHttpErrorCheck -StatusCodeVariable "status_code"

                  if ($status_code -ne 200) {
                    Write-Error ("Failed to get recordings ($status_code): ")
                    $response | Format-List | out-string | Write-Error
                    exit 1
                  }

                  $script:max_page = $response.meta.paging.max_page

                  Write-Information "Got page $script:current_page of $script:max_page, $($response.data.Count) recordings in this page."

                  return $response.data
                }

                $sites = @{}
                function Get-SiteName($raw_name) {
                  if ($sites.ContainsKey($raw_name)) {
                    return $sites[$raw_name]
                  }

                  # Safe folder names
                  $name = $raw_name -replace '[^-_A-Za-z0-9]',''
                  $sites[$raw_name] = $name
                  return $name
                }

                # make output directory
                New-Item -ItemType Directory -Path $target -Force | Out-Null

                while ($null -ne ($recordings = Get-NextPage )) {
                  foreach($recording in $recordings) {
                    Write-Information "Downloading recording $($recording.id)"
                    $recording | write-output

                    $audio_recording_id = $recording.id
                    $site_id = $recording.site_id
                    $name = $recording.canonical_file_name

                    $safe_site_name = Get-SiteName $recording.'sites.name'

                    $sub_folder = Join-Path $target "${site_id}_$safe_site_name"
                    New-Item -ItemType Directory -Path $sub_folder -Force | Out-Null

                    $path = Join-Path $sub_folder $name
                    $recording_url = "$workbench_url/audio_recordings/$audio_recording_id/original"

                    if (Test-Path $path) {
                      if ($clobber) {
                        Write-Information "File exists for recording $audio_recording_id at $path. Re-downloading because clobber was set."
                      }
                      else {
                        $head_response = Invoke-WebRequest -Uri $recording_url `
                          -Method HEAD -Headers $headers -SkipHttpErrorCheck

                        if (-not $head_response.BaseResponse.IsSuccessStatusCode) {
                          Write-Error "Failed to get recording size for $audio_recording_id ($($head_response.StatusCode))."
                          exit 1
                        }

                        $expected_size_header = [string]($head_response.Headers["Content-Length"] | Select-Object -First 1)
                        $expected_size = $null
                        if (-not [string]::IsNullOrWhiteSpace($expected_size_header)) {
                          $parsed_expected_size = 0
                          if ([long]::TryParse($expected_size_header, [ref]$parsed_expected_size)) {
                            $expected_size = $parsed_expected_size
                          }
                        }
                        $existing_size = (Get-Item $path).Length

                        if (($null -ne $expected_size) -and ($existing_size -eq $expected_size)) {
                          Write-Information "Skipping recording $audio_recording_id at $path (already downloaded, size $existing_size bytes)."
                          continue
                        }

                        Write-Information "Re-downloading recording $audio_recording_id at $path (existing size $existing_size bytes, expected $expected_size bytes)."
                      }
                    }

                    Invoke-RestMethod -Uri $recording_url `
                      -Method GET -Headers $headers -StatusCodeVariable "download_status_code" -OutFile $path

                    Write-Information "Downloaded recording $audio_recording_id to $path"
                  }
                }

                Write-Information "Done!"
