                    $recording | write-output

                    $audio_recording_id = $recording.id
                    $site_id = $recording.site_id
                    $name = $recording.canonical_file_name

                    $safe_site_name = Get-SiteName $recording.'sites.name'

                    $sub_folder = Join-Path $target "${site_id}_$safe_site_name"
                    New-Item -ItemType Directory -Path $sub_folder -Force | Out-Null

                    $path = Join-Path $sub_folder $name
                    $recording_url = "$workbench_url/audio_recordings/$audio_recording_id/original"

                    if (Test-Path $path) {
                      if ($clobber) {
                        Write-Information "File exists for recording $audio_recording_id at $path. Re-downloading because clobber was set."
                      }
                      else {
                        $head_response = Invoke-WebRequest -Uri $recording_url `
                          -Method HEAD -Headers $headers -SkipHttpErrorCheck

                        if (-not $head_response.BaseResponse.IsSuccessStatusCode) {
                          Write-Error "Failed to get recording size for $audio_recording_id ($($head_response.StatusCode))."
                          exit 1
                        }

                        $expected_size_header = [string]($head_response.Headers["Content-Length"] | Select-Object -First 1)
                        $expected_size = $null
                        if (-not [string]::IsNullOrWhiteSpace($expected_size_header)) {
                          $parsed_expected_size = 0
                          if ([long]::TryParse($expected_size_header, [ref]$parsed_expected_size)) {
                            $expected_size = $parsed_expected_size
                          }
                        }
                        $existing_size = (Get-Item $path).Length

                        if (($null -ne $expected_size) -and ($existing_size -eq $expected_size)) {
                          Write-Information "Skipping recording $audio_recording_id at $path (already downloaded, size $existing_size bytes)."
                          continue
                        }

                        Write-Information "Re-downloading recording $audio_recording_id at $path (existing size $existing_size bytes, expected $expected_size bytes)."
                      }
                    }

                    Invoke-RestMethod -Uri $recording_url `
                      -Method GET -Headers $headers -StatusCodeVariable "download_status_code" -OutFile $path

                    Write-Information "Downloaded recording $audio_recording_id to $path"
                  }
                }

                Write-Information "Done!"
