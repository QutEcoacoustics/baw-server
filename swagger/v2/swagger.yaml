  "/audio_events/stats":
    post:
      summary: stats audio events
      tags:
      - audio_events
      - audio_events
      parameters: []
      security:
      - auth_token_header: []
      description: |2

        Users that can invoke this route: `Admin`.<br />
        Users that can't: `Harvester`, `owner user`, `writer`, `reader`, `no_access`, `anyone`.

        Note: accessing a list/index/filter endpoint may return no results due to project permissions
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                meta:
                  status: 200
                  message: OK
                data:
                  count: 1
                  taggings_count: 1
              schema:
                allOf:
                - "$ref": "#/components/schemas/standard_response"
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      properties:
                        count:
                          type: integer
                          readOnly: true
                        taggings_count:
                          type: integer
                          readOnly: true
                      required:
                      - count
                      - taggings_count
                      readOnly: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  "$ref": "#/components/schemas/filter_payload_filter"
                sort:
                page:
                projection:
                options:
              required: []
